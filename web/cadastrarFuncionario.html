<!-- Informa que o documento utiliza HTML5. -->

<!DOCTYPE html>

<!-- Início do documento HTML. -->

<html>
<!-- Início do cabeçalho da página. -->
<head>

    <!-- Define o título exibido na aba do navegador. -->
    <title>Cadastrar Funcionários</title>

    <!-- Importa a biblioteca Bootstrap para estilizar a página. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Define a codificação de caracteres da página. -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fecha o cabeçalho da página. -->
</head>

<!-- Início do corpo da página. -->
<body>

    <!-- Cria uma seção centralizada com margem superior. -->
    <section class="container mt-4">

        <!-- Exibe o título principal da página. -->
        <h1 class="text-center">Cadastrar Funcionário</h1>

        <!-- Inicia o formulário que envia os dados para formFuncionario.jsp. -->
        <form method="post" action="formFuncionario.jsp">

            <!-- Cria um grupo para o campo nome. -->
            <div class="form-group">

                <!-- Exibe o texto do campo nome. -->
                <label>Nome:</label>

                <!-- Campo de texto para informar o nome. -->
                <input type="text" name="nome" class="form-control" required>

                <!-- Fecha o grupo do campo nome. -->
            </div>

            <!-- Cria um grupo para o campo CPF. -->
            <div class="form-group">

                <!-- Exibe o texto do campo CPF. -->
                <label>CPF:</label>

                <!-- Campo de texto para informar o CPF. -->
                <input type="text" name="cpf" class="form-control" required>

                <!-- Fecha o grupo do campo CPF. -->
            </div>

            <!-- Cria um grupo para a data de nascimento. -->
            <div class="form-group">

                <!-- Exibe o texto da data de nascimento. -->
                <label>Data de Nascimento:</label>

                <!-- Campo de data para informar a data de nascimento. -->
                <input type="date" name="data_nascimento" class="form-control" required>

                <!-- Fecha o grupo da data de nascimento. -->
            </div>

            <!-- Cria um grupo para o campo gênero. -->
            <div class="form-group">

                <!-- Exibe o texto do campo gênero. -->
                <label>Gênero:</label>

                <!-- Cria uma lista de opções para selecionar o gênero. -->
                <select name="genero" class="form-control">

                    <!-- Opção padrão da lista. -->
                    <option value="">Selecione...</option>

                    <!-- Opção masculino. -->
                    <option>Masculino</option>

                    <!-- Opção feminino. -->
                    <option>Feminino</option>

                    <!-- Fecha a lista de gênero. -->
                </select>

                <!-- Fecha o grupo do campo gênero. -->
            </div>

            <!-- Cria um grupo para o campo RG. -->
            <div class="form-group">

                <!-- Exibe o texto do campo RG. -->
                <label>RG:</label>

                <!-- Campo de texto para informar o RG. -->
                <input type="text" name="rg" class="form-control">

                <!-- Fecha o grupo do campo RG. -->
            </div>

            <!-- Cria um grupo para o campo órgão emissor. -->
            <div class="form-group">

                <!-- Exibe o texto do campo órgão emissor. -->
                <label>Órgão Emissor:</label>

                <!-- Campo de texto para informar o órgão emissor. -->
                <input type="text" name="orgao_emissor" class="form-control">

                <!-- Fecha o grupo do campo órgão emissor. -->
            </div>

            <!-- Cria um grupo para a data de emissão. -->
            <div class="form-group">

                <!-- Exibe o texto da data de emissão. -->
                <label>Data de Emissão:</label>

                <!-- Campo de data para informar a data de emissão. -->
                <input type="date" name="data_emissao" class="form-control">

                <!-- Fecha o grupo da data de emissão. -->
            </div>

            <!-- Cria um grupo para o campo telefone. -->
            <div class="form-group">

                <!-- Exibe o texto do campo telefone. -->
                <label>Telefone:</label>

                <!-- Campo de texto para informar o telefone. -->
                <input type="text" name="telefone" class="form-control" required>

                <!-- Fecha o grupo do campo telefone. -->
            </div>

            <!-- Cria um grupo para o campo email. -->
            <div class="form-group">

                <!-- Exibe o texto do campo email. -->
                <label>Email:</label>

                <!-- Campo para informar o email. -->
                <input type="text" name="email" class="form-control" required>

                <!-- Fecha o grupo do campo email. -->
            </div>

            <!-- Cria um grupo para o campo usuário. -->
            <div class="form-group">

                <!-- Exibe o texto do campo usuário. -->
                <label>ID do Usuário:</label>

                <!-- Campo numérico para informar o ID do usuário. -->
                <input type="number" name="id_usuario" class="form-control">

                <!-- Fecha o grupo do campo usuário. -->
            </div>

            <!-- Cria o botão para enviar o formulário. -->
            <input type="submit" value="Enviar" class="btn btn-primary">

            <!-- Fecha o formulário. -->
        </form>

        <!-- Fecha a seção principal. -->
    </section>

    <!-- Fecha o corpo da página. -->
</body>

<!-- Fecha o documento HTML. -->

</html>
