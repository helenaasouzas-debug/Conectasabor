<!-- Informa que o documento utiliza HTML5. -->

<!DOCTYPE html>

<!-- Início do documento HTML. -->

<html>
<!-- Início do cabeçalho da página. -->
<head>

    <!-- Define o título exibido na aba do navegador. -->
    <title>Cadastrar Comidas</title>

    <!-- Importa a biblioteca Bootstrap para estilizar a página. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Define a codificação de caracteres da página. -->
    <meta charset="UTF-8">

    <!-- Ajusta a página para diferentes tamanhos de tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fecha o cabeçalho da página. -->
</head>

<!-- Início do corpo da página. -->
<body>

    <!-- Cria uma seção centralizada com margem superior. -->
    <section class="container mt-4">

        <!-- Exibe o título principal da página. -->
        <h1 class="text-center">Cadastrar Comida</h1>

        <!-- Inicia o formulário que envia os dados para formComida.jsp. -->
        <form method="post" action="formComida.jsp">

            <!-- Cria um grupo para o campo nome. -->
            <div class="form-group">

                <!-- Exibe o texto do campo nome. -->
                <label>Nome:</label>

                <!-- Campo de texto para informar o nome da comida. -->
                <input type="text" name="nome" class="form-control" required>

                <!-- Fecha o grupo do campo nome. -->
            </div>

            <!-- Cria um grupo para o campo ingredientes. -->
            <div class="form-group">

                <!-- Exibe o texto do campo ingredientes. -->
                <label>Ingredientes:</label>

                <!-- Campo de texto para informar os ingredientes. -->
                <textarea name="ingredientes" class="form-control" rows="4"></textarea>

                <!-- Fecha o grupo do campo ingredientes. -->
            </div>

            <!-- Cria um grupo para o campo valor unitário. -->
            <div class="form-group">

                <!-- Exibe o texto do campo valor unitário. -->
                <label>Valor Unitário:</label>

                <!-- Campo numérico para informar o valor da comida. -->
                <input type="number" name="valor_unitario" class="form-control" step="0.01" required>

                <!-- Fecha o grupo do campo valor unitário. -->
            </div>

            <!-- Cria um grupo para o campo fornecedor. -->
            <div class="form-group">

                <!-- Exibe o texto do campo fornecedor. -->
                <label>Fornecedor:</label>

                <!-- Campo numérico para informar o ID do fornecedor. -->
                <input type="text" name="id_fornecedor" class="form-control">

                <!-- Fecha o grupo do campo fornecedor. -->
            </div>

            <!-- Cria o botão para enviar o formulário. -->
            <input type="submit" value="Enviar" class="btn btn-primary">

            <!-- Fecha o formulário. -->
        </form>

        <!-- Fecha a seção principal. -->
    </section>

    <!-- Fecha o corpo da página. -->
</body>

<!-- Fecha o documento HTML. -->

</html>
