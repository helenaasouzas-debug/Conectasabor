<!-- Informa que o documento utiliza HTML5. -->
<!DOCTYPE html>

<!-- Início do documento HTML. -->
<html>

    <!-- Início do cabeçalho da página. -->
    <head>

        <!-- Define o título exibido na aba do navegador. -->
        <title>Cadastrar Usuários</title>

        <!-- Importa a biblioteca Bootstrap para estilizar a página. -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

        <!-- Define a codificação de caracteres da página. -->
        <meta charset="UTF-8">

        <!-- Ajusta a página para diferentes tamanhos de tela. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Fecha o cabeçalho da página. -->
    </head>

    <!-- Início do corpo da página. -->
    <body>

        <!-- Cria uma seção centralizada com margem superior. -->
        <section class="container mt-4">

            <!-- Exibe o título principal da página. -->
            <h1 class="text-center">Cadastrar Usuário</h1>

            <!-- Inicia o formulário que envia os dados para formUsuario.jsp. -->
            <form method="post" action="formUsuario.jsp">

                <!-- Cria um grupo para o campo nome. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo nome. -->
                    <label>Nome:</label>

                    <!-- Campo de texto para informar o nome. -->
                    <input type="text" name="nome" class="form-control" required>

                    <!-- Fecha o grupo do campo nome. -->
                </div>

                <!-- Cria um grupo para o campo email. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo email. -->
                    <label>Email:</label>

                    <!-- Campo para informar o email. -->
                    <input type="text" name="email" class="form-control" required>

                    <!-- Fecha o grupo do campo email. -->
                </div>

                <!-- Cria um grupo para o campo senha. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo senha. -->
                    <label>Senha:</label>

                    <!-- Campo de texto para digitar a senha de forma oculta. -->
                    <input type="password" name="senha" class="form-control" required>

                    <!-- Fecha o grupo do campo senha. -->
                </div>

                <!-- Cria um grupo para o campo endereço. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo endereço. -->
                    <label>Endereço:</label>

                    <!-- Campo de texto para informar o endereço. -->
                    <input type="text" name="endereco" class="form-control" required>

                    <!-- Fecha o grupo do campo endereço. -->
                </div>
                
                <!-- Cria um grupo para o campo número. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo número. -->
                    <label>Número</label>

                    <!-- Campo numérico para informar o número. -->
                    <input type="number" name="numero" class="form-control" required>

                    <!-- Fecha o grupo do campo número. -->
                </div>
                
                <!-- Cria um grupo para o campo bairro. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo bairro. -->
                    <label>Bairro:</label>

                    <!-- Campo de texto para informar o bairro. -->
                    <input type="text" name="bairro" class="form-control" required>

                    <!-- Fecha o grupo do campo bairro. -->
                </div>
                
                <!-- Cria um grupo para o campo cidade. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo cidade. -->
                    <label>Cidade</label>

                    <!-- Campo numérico para informar a cidade. -->
                    <input type="text" name="cidade" class="form-control" required>

                    <!-- Fecha o grupo do campo cidade. -->
                </div>

                <!-- Cria um grupo para o campo estado. -->
                <div class="form-group">

                    <!-- Exibe o texto do campo estado. -->
                    <label>Estado:</label>

                    <!-- Cria uma lista de opções para selecionar o estado. -->
                    <select name="estado" class="form-control">

                        <!-- Opção padrão da lista. -->
                        <option value="">Selecione...</option>

                        <!-- Opção RS. -->
                        <option>RS</option>

                        <!-- Opção SC. -->
                        <option>SC</option>

                        <!-- Opção PR. -->
                        <option>PR</option>

                        <!-- Opção SP. -->
                        <option>SP</option>

                        <!-- Fecha a lista de estados. -->
                    </select>

                    <!-- Fecha o grupo do campo estado. -->
                </div>
                
                <div class="form-group">
                    <label>CEP:</label>
                    <input type="number" name="cep" class="form-control" required>
                </div>                    

                <!-- Cria o botão para enviar o formulário. -->
                <input type="submit" value="Enviar" class="btn btn-primary">

                <!-- Fecha o formulário. -->
            </form>

            <!-- Fecha a seção principal. -->
        </section>

        <!-- Fecha o corpo da página. -->
    </body>

    <!-- Fecha o documento HTML. -->
</html>
